name: Auto-Compile Portfolio Content

on:
  push:
    paths:
      - 'portfolio-content/**'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Monday at 5:00 AM UTC

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Build Script
        run: node scripts/build-templates.js

      - name: Commit Generated Content
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/assets/weekly src/content/blogs src/data/compiledProtoSem.json
          git commit -m "Auto-compile Obsidian portfolio content [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
